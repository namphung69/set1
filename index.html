<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบรับซ่อมโทรศัพท์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--card:#fff;--ink:#1d2733;--mute:#5f6b78;--line:#d5dbe2;--acc:#0f766e;--accfg:#fff;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1b222a;--ink:#e8edf2;--mute:#9aa6b2;--line:#323c47;--acc:#2dd4bf;--accfg:#06201d;--warn:#fbbf24;--warnbg:#3a2f0c;--bad:#f87171;}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1b222a;--ink:#e8edf2;--mute:#9aa6b2;--line:#323c47;--acc:#2dd4bf;--accfg:#06201d;--warn:#fbbf24;--warnbg:#3a2f0c;--bad:#f87171;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Sarabun,"Noto Sans Thai",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,380px) minmax(0,1fr)}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
header{max-width:1100px;margin:0 auto;padding:16px 16px 0}
header p{margin:0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sym{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.sym label{display:flex;gap:6px;align-items:center;font-weight:400;margin:0;padding:4px 0}
.sym input{width:auto}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:6px;font-weight:600}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.sm{padding:4px 10px;font-size:14px}
.warn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:8px 10px;margin-top:12px;font-size:14px;display:none}
.warn.on{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:140px}.tools select{width:auto}
.job{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.job h3{margin:0;font-size:16px}
.meta{color:var(--mute);font-size:14px}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
.b-center{color:var(--warn);border-color:var(--warn)}
.b-done{color:var(--acc);border-color:var(--acc)}
.sev3{color:var(--bad);border-color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{color:var(--mute);text-align:center;padding:24px}
</style>
</head>
<body>
<header><h1>ระบบรับซ่อมโทรศัพท์</h1><p>สำหรับพนักงานหน้าร้าน: รับเครื่อง ระบุอาการ และส่งศูนย์เมื่อซ่อมเองไม่ได้</p></header>
<div class="warn" id="net" role="alert" style="max-width:1100px;margin:8px auto 0"></div>
<main>
<section class="card">
  <h2>รับเครื่องใหม่</h2>
  <div class="row">
    <div><label for="cn">ชื่อลูกค้า</label><input id="cn"></div>
    <div><label for="cp">เบอร์ติดต่อ</label><input id="cp" inputmode="tel"></div>
  </div>
  <div class="row">
    <div><label for="brand">ยี่ห้อ</label><select id="brand"></select></div>
    <div><label for="model">รุ่น</label><select id="model"></select><input id="mc" placeholder="พิมพ์ชื่อรุ่น" style="display:none;margin-top:6px"></div>
  </div>
  <label for="imei">IMEI / ซีเรียล (ถ้ามี)</label><input id="imei">
  <label>อาการเสีย</label>
  <div class="sym" id="sym"></div>
  <label for="note">รายละเอียดเพิ่มเติม</label><textarea id="note" rows="2"></textarea>
  <label for="sev">ความรุนแรง</label>
  <select id="sev"><option value="1">เบา</option><option value="2">ปานกลาง</option><option value="3">หนัก</option></select>
  <div class="warn" id="warn">อาการนี้หนัก แนะนำให้ส่งซ่อมที่ศูนย์ (กดส่งศูนย์ได้หลังรับเครื่อง)</div>
  <label for="price">ราคาประเมิน (บาท)</label><input id="price" type="number" min="0">
  <div class="acts"><button class="pri" id="add">รับเครื่อง</button><button id="clr">ล้างฟอร์ม</button></div>
</section>
<section class="card">
  <h2>รายการซ่อม</h2>
  <div class="tools">
    <input id="q" placeholder="ค้นหาชื่อ เบอร์ รุ่น">
    <select id="fs"><option value="">ทุกสถานะ</option></select>
  </div>
  <div id="list"></div>
</section>
</main>
<script>
const MODELS={
 "Apple":["iPhone 6","iPhone 6 Plus","iPhone 6s","iPhone 6s Plus","iPhone 7","iPhone 7 Plus","iPhone 8","iPhone 8 Plus","iPhone X","iPhone XR","iPhone XS","iPhone XS Max","iPhone SE (2020)","iPhone SE (2022)","iPhone 11","iPhone 11 Pro","iPhone 11 Pro Max","iPhone 12 mini","iPhone 12","iPhone 12 Pro","iPhone 12 Pro Max","iPhone 13 mini","iPhone 13","iPhone 13 Pro","iPhone 13 Pro Max","iPhone 14","iPhone 14 Plus","iPhone 14 Pro","iPhone 14 Pro Max","iPhone 15","iPhone 15 Plus","iPhone 15 Pro","iPhone 15 Pro Max","iPhone 16","iPhone 16 Plus","iPhone 16 Pro","iPhone 16 Pro Max","iPhone 16e","iPhone 17","iPhone 17 Pro","iPhone 17 Pro Max"],
 "Samsung":["Galaxy A03","Galaxy A04","Galaxy A05","Galaxy A05s","Galaxy A06","Galaxy A13","Galaxy A14","Galaxy A15","Galaxy A16","Galaxy A23","Galaxy A24","Galaxy A25","Galaxy A26","Galaxy A33","Galaxy A34","Galaxy A35","Galaxy A36","Galaxy A53","Galaxy A54","Galaxy A55","Galaxy A56","Galaxy A73","Galaxy M14","Galaxy M15","Galaxy M34","Galaxy M54","Galaxy S21","Galaxy S21+","Galaxy S21 Ultra","Galaxy S21 FE","Galaxy S22","Galaxy S22+","Galaxy S22 Ultra","Galaxy S23","Galaxy S23+","Galaxy S23 Ultra","Galaxy S23 FE","Galaxy S24","Galaxy S24+","Galaxy S24 Ultra","Galaxy S24 FE","Galaxy S25","Galaxy S25+","Galaxy S25 Ultra","Galaxy Z Flip3","Galaxy Z Flip4","Galaxy Z Flip5","Galaxy Z Flip6","Galaxy Z Fold3","Galaxy Z Fold4","Galaxy Z Fold5","Galaxy Z Fold6","Galaxy Note 20","Galaxy Note 20 Ultra"],
 "OPPO":["A17","A18","A38","A57","A58","A60","A78","A79","A98","Reno7","Reno8","Reno8 T","Reno10","Reno10 Pro","Reno11","Reno11 F","Reno12","Reno12 F","Reno13","Reno13 F","Find X5","Find X6","Find X7","Find X8","Find N3 Flip"],
 "vivo":["Y02","Y17s","Y18","Y22s","Y27","Y28","Y36","Y100","V25","V27","V29","V30","V30 Pro","V40","V50","T2","T3","X80","X90","X100","X200"],
 "Xiaomi":["Redmi 12","Redmi 12C","Redmi 13","Redmi 13C","Redmi A3","Redmi Note 11","Redmi Note 12","Redmi Note 12 Pro","Redmi Note 13","Redmi Note 13 Pro","Redmi Note 13 Pro+","Redmi Note 14","Redmi Note 14 Pro","Poco C65","Poco M6","Poco X5","Poco X6","Poco X6 Pro","Poco F5","Poco F6","Xiaomi 12","Xiaomi 13","Xiaomi 13T","Xiaomi 14","Xiaomi 14T","Xiaomi 15"],
 "realme":["C51","C53","C55","C61","C63","C67","11","11 Pro","12","12 Pro","12+","13","13 Pro","GT 5","GT 6","Narzo 70"],
 "Huawei":["nova 9","nova 10","nova 11","nova 12","P50","P60","Mate 50","Mate 60","Pura 70"],
 "Honor":["X6","X7","X8","X9","90","200","Magic5","Magic6"],
 "Infinix":["Hot 30","Hot 40","Hot 50","Note 30","Note 40","Smart 8","Zero 30"],
 "Tecno":["Spark 10","Spark 20","Camon 20","Camon 30","Pova 5","Pova 6"],
 "OnePlus":["Nord CE3","Nord 3","11","12","13"],
 "Google":["Pixel 6","Pixel 7","Pixel 8","Pixel 8 Pro","Pixel 9","Pixel 9 Pro","Pixel 10"],
 "Motorola":["Moto G14","Moto G34","Moto G54","Moto G84","Edge 40","Edge 50","Razr 40","Razr 50"],
 "Nokia":["C32","G22","G42","X30"],
 "Asus":["ROG Phone 7","ROG Phone 8","Zenfone 10","Zenfone 11"],
 "Sony":["Xperia 1 V","Xperia 5 V","Xperia 10 V"],
 "อื่น ๆ":[]
};
const OTHER="อื่น ๆ (พิมพ์ระบุเอง)";
const SYMS=[["จอแตก/ร้าว",2],["จอไม่ติด/ภาพเพี้ยน",3],["ทัชสกรีนไม่ทำงาน",2],["แบตเสื่อม/บวม",1],["ชาร์จไม่เข้า",1],["เปิดไม่ติด",3],["น้ำเข้า",3],["เมนบอร์ด/ไอซีเสีย",3],["ลำโพง/ไมค์เสีย",1],["กล้องเสีย",1],["สัญญาณ/ซิมไม่ขึ้น",2],["ปุ่มกดเสีย",1],["อื่น ๆ",1]];
const STATUS={received:"รับเครื่องแล้ว",repairing:"กำลังซ่อมที่ร้าน",center:"ส่งศูนย์แล้ว",back:"ศูนย์ส่งกลับ",done:"ซ่อมเสร็จ",delivered:"ส่งมอบลูกค้าแล้ว"};
const SEV={1:"เบา",2:"ปานกลาง",3:"หนัก"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let jobs=[];
const SB="https://faxlivdtnqzblryqzidi.supabase.co/rest/v1/jobs";
const KEY="PASTE_ANON_KEY_HERE";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=minimal"};
const setMsg=t=>{$("net").textContent=t;$("net").classList.toggle("on",!!t)};
async function api(method,qs,body){
  if(KEY.startsWith("PASTE")){setMsg("ยังไม่ได้ใส่ anon key ในโค้ด");return null}
  try{
    const r=await fetch(SB+qs,{method,headers:H,body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw new Error(r.status);
    setMsg("");return method==="GET"?await r.json():true;
  }catch(e){setMsg("เชื่อมต่อฐานข้อมูลไม่ได้ ("+e.message+") ข้อมูลอาจยังไม่ถูกบันทึก");return null}
}
async function loadJobs(){
  const rows=await api("GET","?select=data&order=created_at.desc");
  if(rows){jobs=rows.map(r=>r.data);render()}
}

$("brand").innerHTML=Object.keys(MODELS).map(b=>`<option>${esc(b)}</option>`).join("");
const fillModels=()=>{$("model").innerHTML=[...MODELS[$("brand").value],OTHER].map(m=>`<option>${esc(m)}</option>`).join("");toggleMc()};
const toggleMc=()=>{$("mc").style.display=$("model").value===OTHER?"block":"none"};
$("model").onchange=toggleMc;
$("brand").onchange=fillModels;fillModels();
$("sym").innerHTML=SYMS.map(([n,w],i)=>`<label><input type="checkbox" data-w="${w}" value="${esc(n)}">${esc(n)}</label>`).join("");
$("fs").innerHTML+=Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");

const checked=()=>[...document.querySelectorAll("#sym input:checked")];
function suggest(){
  const w=Math.max(0,...checked().map(c=>+c.dataset.w));
  if(w)$("sev").value=w;
  $("warn").classList.toggle("on",+$("sev").value===3);
}
$("sym").onchange=suggest;$("sev").onchange=suggest;

function clearForm(){
  ["cn","cp","imei","note","price","mc"].forEach(i=>$(i).value="");
  checked().forEach(c=>c.checked=false);$("sev").value=1;suggest();
}
$("clr").onclick=clearForm;

$("add").onclick=()=>{
  const name=$("cn").value.trim(),phone=$("cp").value.trim(),syms=checked().map(c=>c.value);
  if(!name||!phone){alert("กรอกชื่อและเบอร์ลูกค้า");return}
  if(!syms.length&&!$("note").value.trim()){alert("ระบุอาการเสียอย่างน้อย 1 อย่าง");return}
  const sev=+$("sev").value;
  if($("model").value===OTHER&&!$("mc").value.trim()){alert("พิมพ์ชื่อรุ่น");return}
  const job={id:"R"+Date.now().toString().slice(-7),name,phone,brand:$("brand").value,model:$("model").value===OTHER?$("mc").value.trim():$("model").value,imei:$("imei").value.trim(),syms,note:$("note").value.trim(),sev,price:$("price").value,status:sev===3?"received":"repairing",at:new Date().toISOString(),log:[]};
  jobs.unshift(job);api("POST","",{id:job.id,data:job});clearForm();render();
};

function setStatus(id,st){
  const j=jobs.find(x=>x.id===id);if(!j)return;
  if(st==="center"){
    const c=prompt("ชื่อศูนย์บริการ / เลขอ้างอิงใบส่งซ่อม (ถ้ามี)","");
    if(c===null)return;j.center=c.trim();j.sentAt=new Date().toISOString();
  }
  j.status=st;j.log.push({st,at:new Date().toISOString()});api("PATCH","?id=eq."+encodeURIComponent(id),{data:j});render();
}
function del(id){if(confirm("ลบรายการนี้?")){jobs=jobs.filter(x=>x.id!==id);api("DELETE","?id=eq."+encodeURIComponent(id));render()}}

function actions(j){
  const b=(st,t,pri)=>`<button class="sm ${pri?"pri":""}" onclick="setStatus('${j.id}','${st}')">${t}</button>`;
  let a="";
  if(j.status==="received")a=b("repairing","เริ่มซ่อมที่ร้าน",1)+b("center","ส่งศูนย์");
  else if(j.status==="repairing")a=b("done","ซ่อมเสร็จ",1)+b("center","ส่งศูนย์ (ซ่อมเองไม่ได้)");
  else if(j.status==="center")a=b("back","ศูนย์ส่งกลับแล้ว",1);
  else if(j.status==="back")a=b("done","ซ่อมเสร็จ",1);
  else if(j.status==="done")a=b("delivered","ส่งมอบลูกค้า",1);
  return a+`<button class="sm" onclick="del('${j.id}')">ลบ</button>`;
}
function render(){
  const q=$("q").value.trim().toLowerCase(),fs=$("fs").value;
  const rows=jobs.filter(j=>(!fs||j.status===fs)&&(!q||[j.name,j.phone,j.model,j.brand,j.id,j.imei].join(" ").toLowerCase().includes(q)));
  $("list").innerHTML=rows.length?rows.map(j=>`
  <div class="job">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <h3>${esc(j.brand)} ${esc(j.model)} <span class="meta">#${esc(j.id)}</span></h3>
      <span><span class="badge sev${j.sev}">${SEV[j.sev]}</span> <span class="badge ${j.status==="center"?"b-center":j.status==="done"||j.status==="delivered"?"b-done":""}">${STATUS[j.status]}</span></span>
    </div>
    <div class="meta">${esc(j.name)} · ${esc(j.phone)}${j.imei?" · IMEI "+esc(j.imei):""} · รับเมื่อ ${new Date(j.at).toLocaleDateString("th-TH")}</div>
    <div>อาการ: ${esc(j.syms.join(", ")||"-")}${j.note?" — "+esc(j.note):""}</div>
    ${j.price?`<div class="meta">ประเมิน ${Number(j.price).toLocaleString("th-TH")} บาท</div>`:""}
    ${j.center!==undefined?`<div class="meta">ส่งศูนย์: ${esc(j.center||"ไม่ระบุ")} (${new Date(j.sentAt).toLocaleDateString("th-TH")})</div>`:""}
    ${j.sev===3&&j.status==="received"?`<div class="meta" style="color:var(--warn)">แนะนำส่งศูนย์</div>`:""}
    <div class="acts">${actions(j)}</div>
  </div>`).join(""):`<div class="empty">ยังไม่มีรายการ รับเครื่องใหม่ทางซ้าย</div>`;
}
$("q").oninput=render;$("fs").onchange=render;render();
loadJobs();setInterval(loadJobs,15000);
</script>
</body>
</html>
